name: Deploy do Blog para o GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🏗️ Compilar site com Eleventy
        run: npm run build

      - name: 🚀 Publicar na branch gh-pages (Deploy via branch)
        uses: peaceiris/actions-gh-pages@v3
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site

      - name: 📤 Upload artefato oficial do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy-pages:
    needs: build-and-deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 🌐 Ativar GitHub Pages oficial
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
